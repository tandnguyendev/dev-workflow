[pytest]
# The suite lives in tests/. Saying so is not tidiness: hooks/test_guard.py matches
# pytest's default `test_*.py` glob, so a bare `pytest` at the repo root collected a
# shipped hook as a test module and died on its `test_blocks()` generator before
# running anything. norecursedirs covers the same collision for an explicit
# `pytest .`.
testpaths = tests
norecursedirs = hooks templates references skills agents .git
